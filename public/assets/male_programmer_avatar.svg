  <path d="M76 96C74 72 86 48 116 46C124 41 138 43 146 50C159 54 166 72 164 96C160 82 153 74 142 71C134 76 118 76 105 72C91 74 82 82 76 96Z" fill="url(#hairGrad)" />
  <path d="M92 52C104 42 126 40 142 48" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Eyebrows (Confident Male Look) -->
  <path d="M93 93C98 90 106 90 111 92" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M129 92C134 90 142 90 147 93" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="102" cy="105" r="4.5" fill="#0F172A" />
  <circle cx="138" cy="105" r="4.5" fill="#0F172A" />
  <circle cx="103.5" cy="103.5" r="1.5" fill="#FFFFFF" />
  <circle cx="139.5" cy="103.5" r="1.5" fill="#FFFFFF" />

  <!-- Modern Developer Glasses with Subtle Cyan Reflection -->
  <rect x="88" y="96" width="28" height="19" rx="5" fill="#06B6D4" fill-opacity="0.12" stroke="#0F172A" stroke-width="2.8" />
  <rect x="124" y="96" width="28" height="19" rx="5" fill="#06B6D4" fill-opacity="0.12" stroke="#0F172A" stroke-width="2.8" />
  <path d="M116 104H124" stroke="#0F172A" stroke-width="2.8" />
  <path d="M78 103L88 104" stroke="#0F172A" stroke-width="2.5" />
  <path d="M152 104L162 103" stroke="#0F172A" stroke-width="2.5" />
  <!-- Lens Glint -->
  <path d="M93 100L98 111" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M129 100L134 111" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Nose -->
  <path d="M120 107V120L116 123" stroke="#C86D44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

