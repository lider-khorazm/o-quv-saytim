  <path d="M68 106C68 68 90 44 120 44C150 44 172 68 172 106" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <path d="M70 100C70 66 91 44 120 44C149 44 170 66 170 100" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Ears & Headphone Cups -->
  <rect x="60" y="94" width="16" height="34" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="2.5" />
  <rect x="164" y="94" width="16" height="34" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="2.5" />
  <circle cx="68" cy="111" r="3.5" fill="#22D3EE" />
  <circle cx="172" cy="111" r="3.5" fill="#22D3EE" />

