  <path d="M108 132C113 137 127 137 132 132" stroke="#9A3412" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing Developer Badge on Hoodie -->
  <rect x="144" y="198" width="32" height="20" rx="6" fill="#090D1A" stroke="#22D3EE" stroke-width="1.8" />
  <path d="M153 205L158 208L153 211" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M161 211H167" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />

  <!-- Outer Frame Border -->
  <rect x="2" y="2" width="236" height="236" rx="46" stroke="url(#neonRim)" stroke-width="4" stroke-opacity="0.55" />
</svg>
