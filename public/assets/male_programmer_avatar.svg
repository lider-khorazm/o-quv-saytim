<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="neonRim" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="40" y1="150" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="85" y1="65" x2="155" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA8C" />
      <stop offset="100%" stop-color="#F09A67" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="75" y1="35" x2="165" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="240" height="240" rx="48" fill="url(#bgGrad)" />
  <circle cx="48" cy="52" r="56" fill="#06B6D4" fill-opacity="0.14" />
  <circle cx="195" cy="185" r="64" fill="#6366F1" fill-opacity="0.18" />

  <!-- Subtle Floating Code Symbols in Background -->
  <g opacity="0.28" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 86L26 96L36 106" />
    <path d="M54 86L64 96L54 106" />
    <path d="M48 82L42 110" />
  </g>
  <g opacity="0.28" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="76" width="34" height="24" rx="5" />
    <path d="M183 85L188 89L183 93" />
    <path d="M192 93H200" />
  </g>

  <!-- Shoulders & Tech Hoodie -->
  <path d="M38 240C42 184 74 162 120 162C166 162 198 184 202 240H38Z" fill="url(#hoodieGrad)" stroke="url(#neonRim)" stroke-width="2.5" />

  <!-- Hoodie Collar & Neon Zip Trim -->
  <path d="M84 164L120 198L156 164" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M120 198V240" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.7" />
  <!-- Hoodie Drawstrings -->
  <path d="M98 178V214" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <path d="M142 178V214" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="103" y="136" width="34" height="34" rx="12" fill="#E58C59" />

