databases:
  - name: devmaster-db
    databaseName: devmaster_academy
    user: devmaster_user
    plan: free

services:
  - type: web
    name: devmaster-academy
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devmaster-db
          property: connectionString
